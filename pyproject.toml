[project]
name = "advanced-rag-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "google-generativeai>=0.8.6",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.5",
    "langchain-google-genai>=4.3.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langsmith>=0.11.0",
    "numpy>=2.5.2",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "pip-system-certs>=5.3",
    "presidio-analyzer>=2.2.362",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.5",
    "redis>=8.1.0",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.61.1",
    "tiktoken>=0.13.0",
]

[project.scripts]
advanced-rag-agent = "advanced_rag_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
